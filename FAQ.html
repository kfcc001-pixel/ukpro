<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>업무 FAQ 검색</title>
  <style>
    :root {
      --blue-900: #15385f;
      --blue-800: #1d4d7b;
      --blue-700: #286493;
      --blue-600: #347cac;
      --blue-100: #eaf4fb;
      --blue-050: #f5f9fc;
      --text-900: #18222d;
      --text-700: #3f4e5d;
      --text-500: #758290;
      --line: #dce5ec;
      --white: #ffffff;
      --mark: #fff1a8;
      --shadow: 0 14px 34px rgba(31, 66, 96, 0.09);
      --radius-lg: 20px;
      --radius-md: 13px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Noto Sans KR", "Apple SD Gothic Neo", Arial, sans-serif;
      color: var(--text-900);
      background:
        radial-gradient(circle at top right, rgba(52, 124, 172, 0.12), transparent 32%),
        linear-gradient(180deg, #f8fbfd 0%, #eef4f8 100%);
    }

    button,
    input { font: inherit; }

    button { cursor: pointer; }

    .app {
      width: min(980px, calc(100% - 32px));
      margin: 0 auto;
      padding: 42px 0 56px;
    }

    .hero {
      margin-bottom: 18px;
      padding: 28px 30px;
      color: var(--white);
      border-radius: var(--radius-lg);
      background: linear-gradient(135deg, var(--blue-900), var(--blue-600));
      box-shadow: var(--shadow);
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 11px;
      padding: 6px 10px;
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 999px;
      background: rgba(255,255,255,0.10);
      font-size: 12px;
      font-weight: 700;
    }

    .hero-badge::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #bfe8ff;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(26px, 4vw, 38px);
      line-height: 1.2;
      letter-spacing: -0.04em;
    }

    .hero p {
      margin: 0;
      color: rgba(255,255,255,0.78);
      font-size: 14px;
      line-height: 1.6;
    }

    .panel {
      overflow: hidden;
      border: 1px solid rgba(220, 229, 236, 0.98);
      border-radius: var(--radius-lg);
      background: rgba(255,255,255,0.97);
      box-shadow: var(--shadow);
    }

    .controls {
      padding: 24px;
      border-bottom: 1px solid var(--line);
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-bottom: 20px;
    }

    .search-box {
      position: relative;
    }

    .search-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      border: 2px solid #71879a;
      border-radius: 50%;
      pointer-events: none;
    }

    .search-icon::after {
      content: "";
      position: absolute;
      width: 7px;
      height: 2px;
      right: -5px;
      bottom: -2px;
      border-radius: 2px;
      background: #71879a;
      transform: rotate(45deg);
      transform-origin: left center;
    }

    #searchInput {
      width: 100%;
      height: 52px;
      padding: 0 44px 0 46px;
      border: 1px solid #ccd9e3;
      border-radius: 13px;
      outline: none;
      color: var(--text-900);
      background: var(--white);
      transition: 0.18s ease;
    }

    #searchInput::placeholder { color: #98a4af; }

    #searchInput:focus {
      border-color: var(--blue-600);
      box-shadow: 0 0 0 4px rgba(52, 124, 172, 0.12);
    }

    .clear-search {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      display: none;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: #647585;
      background: #edf2f6;
      font-size: 17px;
      line-height: 1;
    }

    .clear-search.visible { display: block; }

    .search-actions {
      display: flex;
      gap: 8px;
    }

    .show-all-btn,
    .open-page-btn {
      min-width: 92px;
      height: 52px;
      padding: 0 17px;
      border-radius: 13px;
      font-weight: 800;
      transition: 0.18s ease;
    }

    .show-all-btn {
      border: 1px solid var(--blue-700);
      color: var(--blue-800);
      background: #f4f9fd;
    }

    .open-page-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 132px;
      border: 1px solid var(--blue-700);
      color: var(--white);
      background: var(--blue-700);
      text-decoration: none;
      white-space: nowrap;
    }

    .show-all-btn:hover,
    .show-all-btn:focus-visible {
      color: var(--white);
      background: var(--blue-700);
      outline: none;
    }

    .open-page-btn:hover,
    .open-page-btn:focus-visible {
      background: var(--blue-900);
      border-color: var(--blue-900);
      outline: none;
      transform: translateY(-1px);
    }

    .filter-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .filter-title {
      font-size: 13px;
      font-weight: 800;
      color: var(--text-700);
    }

    .filter-hint {
      color: var(--text-500);
      font-size: 12px;
    }

    .category-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .category-btn {
      padding: 9px 15px;
      border: 1px solid #d2dde6;
      border-radius: 999px;
      color: #526272;
      background: var(--white);
      font-size: 13px;
      font-weight: 750;
      transition: 0.18s ease;
    }

    .category-btn:hover {
      border-color: #a9c5d9;
      background: var(--blue-050);
    }

    .category-btn.active {
      color: var(--white);
      border-color: var(--blue-700);
      background: var(--blue-700);
      box-shadow: 0 7px 16px rgba(40, 100, 147, 0.18);
    }

    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 24px;
      background: #fbfdff;
      border-bottom: 1px solid var(--line);
    }

    .results-header h2 {
      margin: 0;
      font-size: 17px;
      letter-spacing: -0.02em;
    }

    .result-count {
      color: var(--text-500);
      font-size: 13px;
    }

    .result-count strong {
      color: var(--blue-800);
      font-size: 16px;
    }

    .results-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .faq-item {
      padding: 23px 24px;
      border-bottom: 1px solid #e8eef3;
      transition: background 0.16s ease;
    }

    .faq-item:last-child { border-bottom: 0; }
    .faq-item:hover { background: #fbfdff; }

    .faq-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    .question {
      margin: 0;
      color: #1f2d3a;
      font-size: 16px;
      font-weight: 850;
      line-height: 1.55;
      letter-spacing: -0.02em;
    }

    .question::before {
      content: "Q";
      display: inline-grid;
      place-items: center;
      width: 25px;
      height: 25px;
      margin-right: 9px;
      border-radius: 8px;
      color: var(--blue-800);
      background: var(--blue-100);
      font-size: 12px;
      font-weight: 900;
      vertical-align: -2px;
    }

    .category-tag {
      flex: 0 0 auto;
      padding: 6px 10px;
      border-radius: 999px;
      color: var(--blue-800);
      background: var(--blue-050);
      border: 1px solid #d4e5f1;
      font-size: 11px;
      font-weight: 800;
    }

    .answer {
      margin: 0;
      padding-left: 34px;
      color: var(--text-700);
      font-size: 14px;
      line-height: 1.75;
      word-break: keep-all;
    }

    mark {
      padding: 1px 2px;
      border-radius: 3px;
      color: inherit;
      background: var(--mark);
      font-weight: 800;
    }

    .empty-state {
      display: grid;
      place-items: center;
      min-height: 300px;
      padding: 42px 24px;
      text-align: center;
    }

    .empty-icon {
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      margin: 0 auto 15px;
      border-radius: 18px;
      color: var(--blue-700);
      background: var(--blue-100);
      font-size: 26px;
      font-weight: 900;
    }

    .empty-state strong {
      display: block;
      margin-bottom: 7px;
      color: var(--text-900);
      font-size: 16px;
      line-height: 1.55;
    }

    .empty-state p {
      margin: 0;
      color: var(--text-500);
      font-size: 14px;
      line-height: 1.7;
    }

    .data-notice {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin-top: 14px;
      padding: 14px 17px;
      border: 1px solid #d9e5ee;
      border-radius: var(--radius-md);
      color: #5c6c79;
      background: rgba(255,255,255,0.75);
      font-size: 12px;
      line-height: 1.6;
    }

    .data-notice strong { color: var(--blue-800); }

    @media (max-width: 640px) {
      .app {
        width: min(100% - 20px, 980px);
        padding: 14px 0 34px;
      }

      .hero { padding: 23px 20px; }
      .controls { padding: 18px 16px; }
      .search-row { grid-template-columns: 1fr; }
      .search-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .show-all-btn,
      .open-page-btn { width: 100%; }
      .filter-head { align-items: flex-end; }
      .filter-hint { display: none; }
      .category-tabs { gap: 7px; }
      .category-btn { flex: 1 0 auto; text-align: center; }
      .results-header { padding: 16px; }
      .faq-item { padding: 20px 16px; }
      .faq-top { gap: 10px; }
      .question { font-size: 15px; }
      .answer { padding-left: 0; margin-top: 10px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="hero-badge">사내 FAQ</div>
      <h1>업무 FAQ 검색</h1>
      <p>등록된 FAQ 안에서 질문이나 키워드를 검색해 필요한 안내를 빠르게 확인하세요.</p>
    </header>

    <section class="panel" aria-label="업무 FAQ 검색 도우미">
      <div class="controls">
        <div class="search-row">
          <div class="search-box">
            <span class="search-icon" aria-hidden="true"></span>
            <label for="searchInput" class="sr-only" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">FAQ 검색</label>
            <input
              id="searchInput"
              type="search"
              placeholder="질문이나 키워드를 입력하세요."
              autocomplete="off"
              spellcheck="false"
            />
            <button type="button" class="clear-search" id="clearSearch" aria-label="검색어 지우기">×</button>
          </div>
          <div class="search-actions">
            <button type="button" class="show-all-btn" id="showAllBtn">전체보기</button>
            <a
              class="open-page-btn"
              href="https://kfcc001-pixel.github.io/sonjinwo/FAQ.html"
              aria-label="업무 FAQ 페이지로 이동"
            >
              FAQ 페이지 이동
            </a>
          </div>
        </div>

        <div class="filter-head">
          <span class="filter-title">분류</span>
          <span class="filter-hint">카테고리를 선택해 결과를 좁힐 수 있습니다.</span>
        </div>

        <div class="category-tabs" id="categoryTabs" role="group" aria-label="FAQ 분류">
          <button type="button" class="category-btn active" data-category="전체" aria-pressed="true">전체</button>
          <button type="button" class="category-btn" data-category="교육" aria-pressed="false">교육</button>
          <button type="button" class="category-btn" data-category="문서" aria-pressed="false">문서</button>
          <button type="button" class="category-btn" data-category="IT" aria-pressed="false">IT</button>
          <button type="button" class="category-btn" data-category="보안" aria-pressed="false">보안</button>
        </div>
      </div>

      <div class="results-header">
        <h2>검색 결과</h2>
        <div class="result-count" aria-live="polite"><strong id="resultCount">0</strong>건</div>
      </div>

      <ul class="results-list" id="resultsList" aria-live="polite"></ul>
    </section>

    <div class="data-notice">
      <span aria-hidden="true">ⓘ</span>
      <div><strong>안내:</strong> 이 도우미는 등록된 FAQ 데이터만 검색·표시합니다. 검색 결과가 없더라도 별도의 답변을 생성하지 않습니다.</div>
    </div>
  </main>

  <script>
    // 첨부된 합성 FAQ JSON의 내용만 사용합니다.
    // answer_seed 값은 화면의 "답변"으로 그대로 표시합니다.
    const FAQ_DATA = [
      {
        category: "교육",
        question: "교육 신청은 어디에서 하나요?",
        answer: "교육 포털의 과정 검색 후 신청 메뉴를 사용합니다."
      },
      {
        category: "교육",
        question: "신청한 교육을 취소하려면 어떻게 하나요?",
        answer: "신청내역에서 취소 가능 여부를 확인합니다."
      },
      {
        category: "문서",
        question: "주간 업무보고에는 무엇을 넣어야 하나요?",
        answer: "주요 실적, 이슈, 다음 주 계획을 중심으로 작성합니다."
      },
      {
        category: "IT",
        question: "사내 시스템 접속이 되지 않습니다.",
        answer: "네트워크, 브라우저, 계정 상태를 순서대로 확인합니다."
      },
      {
        category: "보안",
        question: "ChatGPT에 내부 업무자료를 넣어도 되나요?",
        answer: "교육에서는 합성자료를 사용하고, 실제 자료는 조직의 보안 및 AI 사용 기준을 먼저 확인합니다."
      }
    ];

    const searchInput = document.getElementById("searchInput");
    const clearSearch = document.getElementById("clearSearch");
    const showAllBtn = document.getElementById("showAllBtn");
    const categoryTabs = document.getElementById("categoryTabs");
    const resultCount = document.getElementById("resultCount");
    const resultsList = document.getElementById("resultsList");

    let selectedCategory = "전체";

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeRegExp(value) {
      return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function getKeywords() {
      return searchInput.value
        .trim()
        .split(/\s+/)
        .filter(Boolean);
    }

    function highlight(text, keywords) {
      let safeText = escapeHtml(text);
      const uniqueKeywords = [...new Set(keywords.map((keyword) => keyword.trim()).filter(Boolean))]
        .sort((a, b) => b.length - a.length);

      if (uniqueKeywords.length === 0) return safeText;

      const pattern = uniqueKeywords.map(escapeRegExp).join("|");
      const regex = new RegExp(`(${pattern})`, "gi");
      return safeText.replace(regex, "<mark>$1</mark>");
    }

    function matchesSearch(item, keywords) {
      if (keywords.length === 0) return true;

      const searchableText = `${item.question} ${item.answer} ${item.category}`.toLocaleLowerCase("ko-KR");
      return keywords.every((keyword) =>
        searchableText.includes(keyword.toLocaleLowerCase("ko-KR"))
      );
    }

    function getFilteredData() {
      const keywords = getKeywords();

      return FAQ_DATA.filter((item) => {
        const categoryMatches = selectedCategory === "전체" || item.category === selectedCategory;
        return categoryMatches && matchesSearch(item, keywords);
      });
    }

    function render() {
      const keywords = getKeywords();
      const filtered = getFilteredData();

      clearSearch.classList.toggle("visible", searchInput.value.length > 0);
      resultCount.textContent = filtered.length;

      if (filtered.length === 0) {
        resultsList.innerHTML = `
          <li class="empty-state">
            <div>
              <div class="empty-icon" aria-hidden="true">?</div>
              <strong>등록된 FAQ에서 답변을 찾을 수 없습니다.</strong>
              <p>관련 담당부서 또는 공식 안내자료를 확인해 주세요.</p>
            </div>
          </li>
        `;
        return;
      }

      resultsList.innerHTML = filtered.map((item) => `
        <li class="faq-item">
          <div class="faq-top">
            <h3 class="question">${highlight(item.question, keywords)}</h3>
            <span class="category-tag">${highlight(item.category, keywords)}</span>
          </div>
          <p class="answer">${highlight(item.answer, keywords)}</p>
        </li>
      `).join("");
    }

    function setCategory(category) {
      selectedCategory = category;

      categoryTabs.querySelectorAll(".category-btn").forEach((button) => {
        const isActive = button.dataset.category === category;
        button.classList.toggle("active", isActive);
        button.setAttribute("aria-pressed", String(isActive));
      });

      render();
    }

    searchInput.addEventListener("input", render);

    categoryTabs.addEventListener("click", (event) => {
      const button = event.target.closest(".category-btn");
      if (!button) return;
      setCategory(button.dataset.category);
    });

    clearSearch.addEventListener("click", () => {
      searchInput.value = "";
      searchInput.focus();
      render();
    });

    showAllBtn.addEventListener("click", () => {
      searchInput.value = "";
      setCategory("전체");
      searchInput.focus();
    });

    render();
  </script>
</body>
</html>
