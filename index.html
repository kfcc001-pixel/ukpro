<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>업무 FAQ 검색</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        Arial,
        sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    .container {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0 80px;
    }

    /* 제목 */
    .header {
      margin-bottom: 32px;
    }

    .header h1 {
      margin: 0 0 10px;
      font-size: 32px;
      color: #111827;
      letter-spacing: -0.8px;
    }

    .header p {
      margin: 0;
      color: #6b7280;
      font-size: 15px;
      line-height: 1.6;
    }

    /* 검색 패널 */
    .search-panel {
      margin-bottom: 24px;
      padding: 22px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    }

    .search-row {
      display: flex;
      gap: 10px;
    }

    .search-input {
      flex: 1;
      height: 50px;
      padding: 0 16px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      transition: 0.2s;
    }

    .search-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .reset-button {
      height: 50px;
      padding: 0 20px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .reset-button:hover {
      background: #374151;
    }

    /* 분류 */
    .category-area {
      margin-top: 20px;
    }

    .category-label {
      display: block;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 700;
      color: #374151;
    }

    .category-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .category-button {
      padding: 9px 15px;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      background: #ffffff;
      color: #4b5563;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
    }

    .category-button:hover {
      border-color: #2563eb;
      color: #2563eb;
    }

    .category-button.active {
      border-color: #2563eb;
      background: #2563eb;
      color: #ffffff;
      font-weight: 600;
    }

    /* 검색 결과 */
    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .result-header h2 {
      margin: 0;
      font-size: 20px;
      color: #111827;
    }

    .result-count {
      color: #6b7280;
      font-size: 14px;
    }

    .result-count strong {
      color: #2563eb;
      font-size: 16px;
    }

    .faq-list {
      display: grid;
      gap: 14px;
    }

    /* FAQ 카드 */
    .faq-card {
      padding: 22px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      transition: 0.2s;
    }

    .faq-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.06);
    }

    .faq-meta {
      margin-bottom: 12px;
    }

    .category-badge {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      background: #eff6ff;
      color: #2563eb;
      font-size: 12px;
      font-weight: 700;
    }

    .question {
      margin: 0 0 14px;
      color: #111827;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.55;
    }

    .question::before {
      content: "Q. ";
      color: #2563eb;
    }

    .answer {
      margin: 0;
      padding-top: 14px;
      border-top: 1px solid #f0f1f3;
      color: #4b5563;
      font-size: 15px;
      line-height: 1.75;
    }

    .answer::before {
      content: "A. ";
      color: #059669;
      font-weight: 700;
    }

    /* 검색어 강조 */
    mark {
      padding: 1px 2px;
      background: #fef08a;
      color: inherit;
      border-radius: 3px;
    }

    /* 검색 결과 없음 */
    .empty-state {
      padding: 54px 24px;
      text-align: center;
      background: #ffffff;
      border: 1px dashed #d1d5db;
      border-radius: 14px;
      color: #6b7280;
    }

    .empty-state strong {
      display: block;
      margin-bottom: 8px;
      color: #374151;
      font-size: 17px;
    }

    /* 모바일 */
    @media (max-width: 640px) {
      .container {
        width: min(100% - 24px, 920px);
        padding-top: 32px;
      }

      .header h1 {
        font-size: 27px;
      }

      .search-panel {
        padding: 16px;
      }

      .search-row {
        flex-direction: column;
      }

      .reset-button {
        width: 100%;
      }

      .faq-card {
        padding: 18px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <!-- 제목 -->
    <header class="header">
      <h1>업무 FAQ 검색</h1>
      <p>
        질문이나 키워드를 입력하거나 분류를 선택하여
        필요한 업무 FAQ를 찾아보세요.
      </p>
    </header>

    <!-- 검색 및 분류 -->
    <section class="search-panel">

      <div class="search-row">
        <input
          type="search"
          id="searchInput"
          class="search-input"
          placeholder="질문이나 키워드를 입력하세요."
          autocomplete="off"
          aria-label="업무 FAQ 검색"
        />

        <button
          type="button"
          id="resetButton"
          class="reset-button"
        >
          전체보기
        </button>
      </div>

      <div class="category-area">
        <span class="category-label">분류</span>

        <div class="category-buttons">

          <button
            type="button"
            class="category-button active"
            data-category="전체"
          >
            전체
          </button>

          <button
            type="button"
            class="category-button"
            data-category="교육"
          >
            교육
          </button>

          <button
            type="button"
            class="category-button"
            data-category="문서"
          >
            문서
          </button>

          <button
            type="button"
            class="category-button"
            data-category="IT"
          >
            IT
          </button>

          <button
            type="button"
            class="category-button"
            data-category="보안"
          >
            보안
          </button>

          <button
            type="button"
            class="category-button"
            data-category="인사"
          >
            인사
          </button>

        </div>
      </div>
    </section>

    <!-- 검색 결과 -->
    <section>
      <div class="result-header">
        <h2>검색 결과</h2>

        <div
          id="resultCount"
          class="result-count"
          aria-live="polite"
        ></div>
      </div>

      <div
        id="faqList"
        class="faq-list"
      ></div>
    </section>

  </main>

  <script>
    /*
      첨부된 JSON에 있는 데이터만 사용합니다.
      FAQ에 없는 답변은 생성하지 않습니다.
    */
    const faqData = [
      {
        category: "교육",
        question: "교육 신청은 어디에서 하나요?",
        answer_seed:
          "교육 포털의 과정 검색 후 신청 메뉴를 사용합니다."
      },
      {
        category: "교육",
        question: "신청한 교육을 취소하려면 어떻게 하나요?",
        answer_seed:
          "신청내역에서 취소 가능 여부를 확인합니다."
      },
      {
        category: "문서",
        question: "주간 업무보고에는 무엇을 넣어야 하나요?",
        answer_seed:
          "주요 실적, 이슈, 다음 주 계획을 중심으로 작성합니다."
      },
      {
        category: "IT",
        question: "사내 시스템 접속이 되지 않습니다.",
        answer_seed:
          "네트워크, 브라우저, 계정 상태를 순서대로 확인합니다."
      },
      {
        category: "보안",
        question: "ChatGPT에 내부 업무자료를 넣어도 되나요?",
        answer_seed:
          "교육에서는 합성자료를 사용하고, 실제 자료는 조직의 보안 및 AI 사용 기준을 먼저 확인합니다."
      },
      {
        category: "인사",
        question: "휴가 등록은 어디에서 하나요?",
        answer_seed:
          "인사관리시스템의 휴가 카테고리에서 신청 가능합니다."
      }
    ];

    const searchInput =
      document.getElementById("searchInput");

    const faqList =
      document.getElementById("faqList");

    const resultCount =
      document.getElementById("resultCount");

    const resetButton =
      document.getElementById("resetButton");

    const categoryButtons =
      document.querySelectorAll(".category-button");

    let selectedCategory = "전체";

    /*
      HTML 특수문자 처리
    */
    function escapeHTML(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    /*
      정규식 특수문자 처리
    */
    function escapeRegExp(text) {
      return text.replace(
        /[.*+?^${}()|[\]\\]/g,
        "\\$&"
      );
    }

    /*
      검색어 강조
    */
    function highlightText(text, keyword) {
      const safeText = escapeHTML(text);

      if (!keyword) {
        return safeText;
      }

      const escapedKeyword =
        escapeRegExp(keyword);

      const regex =
        new RegExp(`(${escapedKeyword})`, "gi");

      return safeText.replace(
        regex,
        "<mark>$1</mark>"
      );
    }

    /*
      검색 조건에 맞는 FAQ 가져오기
    */
    function getFilteredFAQs() {
      const keyword =
        searchInput.value.trim().toLowerCase();

      return faqData.filter((faq) => {

        const categoryMatches =
          selectedCategory === "전체" ||
          faq.category === selectedCategory;

        const searchableText =
          `${faq.question} ${faq.answer_seed}`
            .toLowerCase();

        const keywordMatches =
          keyword === "" ||
          searchableText.includes(keyword);

        return (
          categoryMatches &&
          keywordMatches
        );
      });
    }

    /*
      검색 결과 화면 출력
    */
    function renderFAQs() {
      const keyword =
        searchInput.value.trim();

      const filteredFAQs =
        getFilteredFAQs();

      resultCount.innerHTML =
        `총 <strong>${filteredFAQs.length}</strong>건`;

      /*
        결과가 없을 때
        새 답변을 생성하지 않습니다.
      */
      if (filteredFAQs.length === 0) {

        faqList.innerHTML = `
          <div class="empty-state">
            <strong>검색 결과가 없습니다.</strong>
            등록된 FAQ에서 다른 키워드나
            분류를 선택해 주세요.
          </div>
        `;

        return;
      }

      /*
        등록된 FAQ만 출력
      */
      faqList.innerHTML =
        filteredFAQs
          .map((faq) => {

            return `
              <article class="faq-card">

                <div class="faq-meta">
                  <span class="category-badge">
                    ${escapeHTML(faq.category)}
                  </span>
                </div>

                <h3 class="question">
                  ${highlightText(
                    faq.question,
                    keyword
                  )}
                </h3>

                <p class="answer">
                  ${highlightText(
                    faq.answer_seed,
                    keyword
                  )}
                </p>

              </article>
            `;
          })
          .join("");
    }

    /*
      키워드 검색
      입력하는 즉시 결과 갱신
    */
    searchInput.addEventListener(
      "input",
      renderFAQs
    );

    /*
      분류 필터
    */
    categoryButtons.forEach((button) => {

      button.addEventListener(
        "click",
        () => {

          selectedCategory =
            button.dataset.category;

          categoryButtons.forEach(
            (item) => {
              item.classList.remove("active");
            }
          );

          button.classList.add("active");

          renderFAQs();
        }
      );

    });

    /*
      전체보기 버튼
      검색어와 분류 초기화
    */
    resetButton.addEventListener(
      "click",
      () => {

        searchInput.value = "";
        selectedCategory = "전체";

        categoryButtons.forEach(
          (button) => {

            button.classList.toggle(
              "active",
              button.dataset.category === "전체"
            );

          }
        );

        renderFAQs();
        searchInput.focus();
      }
    );

    /*
      최초 실행 시 전체 FAQ 표시
    */
    renderFAQs();
  </script>
</body>
</html>
